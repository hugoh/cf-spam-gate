name = "cf-spam-gate"
main = "src/index.ts"
compatibility_date = "2026-08-04"

# ROUTES maps a protected recipient address to its real forwarding
# destination(s) and an optional per-recipient spam-threshold override.
# See README.md for the entry format and how to manage entries.
#
# `id` below is this deployment's real KV namespace. If you're deploying
# your own instance of this worker, run `wrangler kv namespace create
# ROUTES` and replace it with the id it prints — deploying under a
# different Cloudflare account with this id unchanged will just fail
# (you don't own the namespace), not write into someone else's data.
[[kv_namespaces]]
binding = "ROUTES"
id = "3e0599865a5e43208b47a669e8294cb1"

# STATS is a SQLite-backed Durable Object holding lightweight RRD-style
# usage counters (see STATS_ENABLED below), exposed read-only over HTTP at
# GET /stats. No Terraform/manual provisioning needed — `wrangler deploy`
# creates the namespace from the migration below.
[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatsCounter"]

# Custom route so GET /stats has a fixed hostname that Cloudflare Access can
# protect (see the terraform-managed cloudflare_zero_trust_access_application
# "spam_gate_stats" and DNS record in the iac repo). Mail delivery (the
# `email()` handler) doesn't go through this route -- only fetch() does.
[[routes]]
pattern = "spam-gate-stats.larve.net/*"
zone_name = "larve.net"

[observability]
enabled = true

# Daily purge of stats buckets older than the configured retention (see
# STATS_HOUR_RETENTION_DAYS / STATS_DAY_RETENTION_DAYS below). Kept out of the
# email() hot path — the scheduled() handler calls StatsCounter.purgeExpired.
[triggers]
crons = ["0 3 * * *"]

[vars]
# Default spam-score threshold (0-1) when a recipient has no override in ROUTES.
DEFAULT_THRESHOLD = "0.5"
# Relative weights for each detection signal; the weighted average is
# compared against the threshold. Must be valid JSON.
SIGNAL_WEIGHTS = "{\"content\":0.3,\"url\":0.15,\"header\":0.05,\"dnsbl\":0.1,\"attachment\":0.1,\"pii\":0.05,\"auth\":0.25}"
# Default message returned to the sending MTA when a message is rejected as spam.
REJECT_MESSAGE = "Message rejected as spam"
# Optional: per-category overrides for REJECT_MESSAGE, keyed by whichever
# signal category contributed most to the score. Categories: reputation,
# attachment, links, content. Missing categories fall back to REJECT_MESSAGE.
REJECT_MESSAGES = "{\"reputation\":\"Sender IP is on a blocklist\",\"attachment\":\"Attachment type not allowed\",\"links\":\"Message contains suspicious links\",\"content\":\"Message rejected as spam\"}"

# Lightweight usage stats (message counts, spam/forward split, per-signal
# fire counts) kept as hourly/daily RRD-style buckets and exposed at
# GET /stats. Off by default — the endpoint 404s and no data is collected
# until this is "true". Intended to sit behind a Cloudflare Access
# application on whatever route this worker is deployed to; this repo adds
# no auth of its own.
STATS_ENABLED = "true"
# How many days of hourly / daily stats buckets to keep before pruning.
STATS_HOUR_RETENTION_DAYS = "30"
STATS_DAY_RETENTION_DAYS = "400"

# Optional JSON-array overrides for the built-in detection lists below; each
# falls back to a sane default (see README) when unset or malformed.
# SUSPICIOUS_TLDS = "[\"zip\",\"mov\",\"top\",\"xyz\",\"click\",\"link\",\"gq\",\"tk\",\"ml\",\"quest\",\"work\",\"loan\"]"
# DANGEROUS_EXTENSIONS = "[\"exe\",\"scr\",\"js\",\"vbs\",\"bat\",\"cmd\",\"msi\",\"com\",\"pif\",\"jar\",\"ps1\"]"
# MACRO_EXTENSIONS = "[\"docm\",\"xlsm\",\"pptm\"]"
# OOXML_ZIP_EXTENSIONS = "[\"docx\",\"xlsx\",\"pptx\",\"docm\",\"xlsm\",\"pptm\"]"

# Optional: a free Spamhaus DQS key enables the DNSBL signal (best-effort —
# see README). Without it, that signal is skipped, not scored as spam.
# Set with: wrangler secret put SPAMHAUS_DQS_KEY
