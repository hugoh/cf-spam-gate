---
name: retrain

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  retrain:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Retrain content classifier
        run: bun run train-model
      - name: Open a PR if the model changed
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: retrain content classifier"
          title: "chore: scheduled content classifier retrain"
          body: |
            Automated monthly retrain of `data/model.json` from the public
            training corpus (see `scripts/train-model.mjs`). CI runs the
            normal test suite against this PR; auto-merge is enabled, so it
            merges itself once checks pass — no action needed unless a check
            fails.
          branch: retrain/content-classifier
          add-paths: data/model.json
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"
