---
name: ci

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@291292b5f57986fd54e50e357158446ea960d47e # v1.34.0
        with:
          extra-cache-key-cmd: cat package-lock.json
          extra-cache-paths: ~/.npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Validate wrangler.toml config
        run: npm run validate-config
      - name: Verify the worker still bundles (catches Workers-runtime-incompatible deps)
        run: npx wrangler deploy --dry-run --outdir=dist

  deploy:
    # Disabled for now — not yet decided whether deploys should be automatic.
    # Set the DEPLOY_ENABLED repository variable to "true" (and the
    # CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID repo secrets) to re-enable.
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@291292b5f57986fd54e50e357158446ea960d47e # v1.34.0
        with:
          extra-cache-key-cmd: cat package-lock.json
          extra-cache-paths: ~/.npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
