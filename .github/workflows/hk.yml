---
name: hk

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@bb265ccce6562fcb1ad4ae85a4aacc72de332652 # v1.20.0
    permissions:
      contents: read
      packages: read
      statuses: write
    with:
      pre-hk: bun install --frozen-lockfile
