---
name: hk

permissions: {}

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
        github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: hugoh/gh-workflows/setup@b1fb42d4c93e059b994709856e2a9336329b86bd # v1.16.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: hugoh/gh-workflows/hk-check@b1fb42d4c93e059b994709856e2a9336329b86bd # v1.16.0
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
