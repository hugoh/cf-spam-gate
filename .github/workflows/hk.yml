---
name: hk

permissions: {}

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  lint:
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
        github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: hugoh/gh-workflows/setup@2be2abe062a87656771f823fcd8ccbe8dae9b149 # v1.9.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: hugoh/gh-workflows/hk-check@2be2abe062a87656771f823fcd8ccbe8dae9b149 # v1.9.0
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
